name: Deploy to Cloudways

on:
  push:
    branches:
      - staging
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set deployment path
        id: set-path
        run: |
          if [ "${{ github.ref_name }}" == "staging" ]; then
            echo "deploy_path=/home/master/applications/ftgtnduhbt/public_html" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=/home/master/applications/duesaptjae/public_html" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }} << 'ENDSSH'
            cd ${{ steps.set-path.outputs.deploy_path }}
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            if [ -d "wp-content/cache/breeze" ]; then
              rm -rf wp-content/cache/breeze/*
              echo "Breeze cache cleared"
            fi
            echo "Deployed ${{ github.ref_name }} to ${{ steps.set-path.outputs.environment }}"
          ENDSSH
