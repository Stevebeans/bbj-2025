name: Deploy to Cloudways

on:
  push:
    branches:
      - staging
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set deployment path
        id: set-path
        run: |
          if [ "${{ github.ref_name }}" == "staging" ]; then
            echo "deploy_path=/home/master/applications/ftgtnduhbt/public_html" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=/home/master/applications/duesaptjae/public_html" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.CLOUDWAYS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }} "cd ${{ steps.set-path.outputs.deploy_path }} && git fetch origin && git reset --hard origin/${{ github.ref_name }} && echo 'Deployed ${{ github.ref_name }}'"
